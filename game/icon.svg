<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="A buried pot">
  <rect width="512" height="512" fill="#1a130c"/>
  <!-- soil strata: the chapter's whole idea, layers as time -->
  <rect y="330" width="512" height="182" fill="#2e2115"/>
  <rect y="330" width="512" height="8" fill="#3f2e1c"/>
  <rect y="392" width="512" height="6" fill="#382a19"/>
  <rect y="452" width="512" height="6" fill="#332617"/>
  <!-- warm glow behind the find -->
  <circle cx="256" cy="286" r="132" fill="#e0a25e" opacity="0.10"/>
  <!-- the pot -->
  <g fill="#c4763a">
    <path d="M256 150c-46 0-84 30-84 74 0 26 12 44 12 70 0 44-26 62-26 96 0 40 44 66 98 66s98-26 98-66c0-34-26-52-26-96 0-26 12-44 12-70 0-44-38-74-84-74z"/>
  </g>
  <!-- rim and neck -->
  <rect x="196" y="150" width="120" height="26" rx="13" fill="#a75f2c"/>
  <!-- the maker's mark, the thing the epigraphist reads -->
  <path d="M226 300h60M256 272v56" stroke="#f3d9b0" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- highlight -->
  <path d="M212 232c0 40-10 54-10 84" stroke="#e0a25e" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.45"/>
</svg>
